server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Handle /web-app/ prefix — ^~ ensures priority over regex locations
  location ^~ /web-app/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
      expires 1y;
      add_header Cache-Control "public";
    }

    # Don't cache HTML
    location ~* \.html$ {
      expires -1;
    }
  }

  # Redirect /web-app to /web-app/
  location = /web-app {
    return 301 /web-app/;
  }

  # Serve root files (fallback)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
